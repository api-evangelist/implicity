summary: >-
  Implicity publishes an @implicity npm scope containing seven first-party NestJS platform libraries.
  These are INTERNAL infrastructure modules (logging, HTTP, query criteria, MinIO, RabbitMQ, Kong,
  Consul) that Implicity's own microservices consume — they are NOT client SDKs for an Implicity API and
  none of them wrap a public Implicity endpoint. No first-party Implicity API client library exists on
  npm, PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist or crates.io. Every package in the
  scope last published in 2019, and several carry the placeholder description "description", so the scope
  is effectively abandoned as a public artifact.
