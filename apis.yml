aid: implicity
name: Implicity
description: 'Implicity is a Paris-based digital health company operating a vendor-neutral, cloud-based
  cardiac remote monitoring platform. Its software ingests and normalizes transmissions from cardiac
  implantable electronic devices (CIED) and implantable loop recorders across every major manufacturer,
  then applies AI-based triage to surface clinically actionable alerts for care teams. The product family
  spans CIED remote monitoring, heart-failure remote monitoring, an ILR ECG Analyzer, AF alert management,
  SignalHF predictive AI, patient connectivity management, InLink in-clinic data capture, and an advanced
  research tool for academic medical centers and life-science partners. Implicity markets a bidirectional
  EHR/EMR integration and API framework to hospital IT teams, but publishes no public developer portal,
  API reference, or machine-readable contract; integration is arranged through its sales and IT teams.
  Security and compliance posture is published through a Bastion-hosted trust center covering ISO 27001:2022,
  ISO 13485, SOC 2 Type 2, HDS, C5, HIPAA, and GDPR.'
