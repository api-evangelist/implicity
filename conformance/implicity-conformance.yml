summary: >-
  Implicity's published conformance posture is entirely regulatory/organizational, not technical. The
  trust center names seven compliance programs and the IT-teams page names four of them again. No
  technical API standard can be asserted: Implicity publishes no OpenAPI, AsyncAPI, GraphQL SDL, FHIR
  CapabilityStatement or SMART on FHIR discovery document, so every cross-cutting API standard below is
  recorded as unknown rather than false — an absent contract is not a negative conformance finding.
